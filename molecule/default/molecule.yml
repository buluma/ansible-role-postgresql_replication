---
#
# Ansible managed
#
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml
lint: |
  set -e
  yamllint .
  ansible-lint
driver:
  name: docker
platforms:
  # This role tests master/replica streaming replication, which needs two
  # nodes - checks.yml asserts the postgresql group has exactly 2 members.
  - name: "postgresqlreplication-master-${image:-fedora}-${tag:-latest}"
    image: "${namespace:-buluma}/${image:-fedora}:${tag:-latest}"
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    groups:
      - postgresql
      - postgresql_master
  - name: "postgresqlreplication-replica-${image:-fedora}-${tag:-latest}"
    image: "${namespace:-buluma}/${image:-fedora}:${tag:-latest}"
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    pre_build_image: true
    groups:
      - postgresql
      - postgresql_replicas
provisioner:
  name: ansible
verifier:
  name: ansible
